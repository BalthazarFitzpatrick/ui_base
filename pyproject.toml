[project]
name = "ui-base"
version = "0.1.0"
description = "the shared web interface for these tools: menus, tabs, sliders, pan/zoom, alignment"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ui_base"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = ["ruff>=0.11.0", "pytest>=8.0"]
